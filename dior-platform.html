<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --black:#1a1a1a;--white:#ffffff;--off-white:#f7f7f7;--gray:#888888;--light-gray:#e5e5e5;
  --gold:#c9a96e;--gld:#b8944f;--red:#e53935;--grn:#43a047;--blue:#1e88e5;
  --font-serif:'Playfair Display',Georgia,'Times New Roman',serif;
  --font-sans:'Inter',-apple-system,Helvetica Neue,Arial,sans-serif;
  --header:56px;--bottomnav:68px;
}
html{scroll-behavior:smooth}
body{font-family:var(--font-sans);color:var(--black);background:var(--off-white);min-height:100vh}
a{color:inherit;text-decoration:none}
button{cursor:pointer;font:inherit;border:none;background:none}

/* LOGIN */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--white);padding:80px 24px}
.login-grid{display:grid;grid-template-columns:1fr 1fr;max-width:1000px;width:100%;gap:80px;align-items:center}
.login-image{position:relative;aspect-ratio:3/4;overflow:hidden;background:var(--off-white)}
.login-image img{width:100%;height:100%;object-fit:cover;object-position:center 20%}
.login-form-side{padding:40px 0}
.login-form-side h2{font-family:var(--font-serif);font-size:clamp(28px,3vw,38px);font-weight:400;letter-spacing:0.04em;margin-bottom:12px}
.login-form-side .subtitle{font-size:13px;color:var(--gray);letter-spacing:0.02em;margin-bottom:48px;line-height:1.6}
.login-fg{margin-bottom:28px}
.login-fg label{display:block;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--black);margin-bottom:10px;font-weight:400}
.login-input{width:100%;padding:14px 0;border:none;border-bottom:1px solid var(--light-gray);font-family:var(--font-sans);font-size:14px;color:var(--black);background:transparent;transition:border-color 0.3s;outline:none}
.login-input:focus{border-color:var(--black)}
.login-input::placeholder{color:#bbb}
.login-err{color:var(--red);font-size:11px;margin-top:6px}
.login-link{text-align:center;margin-top:16px;font-size:13px;color:var(--gray)}
.login-link a{color:var(--black);text-decoration:underline;text-underline-offset:3px}
.login-link a:hover{color:var(--gray)}

/* HEADER */
.dior-header{position:fixed;top:0;left:0;right:0;height:var(--header);background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-bottom:1px solid var(--light-gray);z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.dior-header .hdr-left{display:flex;align-items:center;gap:16px}
.dior-header .hdr-right{display:flex;align-items:center;gap:16px}
.dior-header .logo{font-family:var(--font-serif);font-size:22px;font-weight:500;letter-spacing:0.18em;text-transform:uppercase}
.dior-header .hdr-link{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--black);cursor:pointer;transition:color .2s}
.dior-header .hdr-link:hover{color:var(--gold)}
.hdr-logout{cursor:pointer;display:flex;align-items:center;gap:4px;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--red);transition:color .2s}
.hdr-logout:hover{color:#b71c1c}
.hdr-logout svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:var(--bottomnav);background:var(--black);display:flex;align-items:flex-end;justify-content:space-around;z-index:100;border-top:1px solid #333;padding-bottom:4px}
.bottom-nav .bnav-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 12px 6px;cursor:pointer;transition:all .2s;min-width:56px;flex:1;max-width:80px}
.bottom-nav .bnav-item svg{width:20px;height:20px;stroke:rgba(255,255,255,.85);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transition:stroke .2s}
.bottom-nav .bnav-item span{font-size:9px;color:rgba(255,255,255,.85);letter-spacing:0.04em;transition:color .2s;text-align:center;line-height:1.2}
.bottom-nav .bnav-item.active svg{stroke:var(--gold)}
.bottom-nav .bnav-item.active span{color:var(--gold)}
.bnav-center{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 12px;cursor:pointer;z-index:101;flex:1;max-width:80px}
.bnav-center .center-circle{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gld));display:flex;align-items:center;justify-content:center;margin-top:-30px;box-shadow:0 4px 20px rgba(201,169,110,.4);transition:all .25s}
.bnav-center .center-circle svg{width:22px;height:22px;stroke:var(--white);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bnav-center .center-circle:hover{transform:scale(1.08);box-shadow:0 6px 28px rgba(201,169,110,.55)}
.bnav-center span{font-size:9px;color:rgba(255,255,255,.85);letter-spacing:0.06em;margin-top:4px;text-align:center;line-height:1.2;transition:color .2s}
.bnav-center.active .center-circle{box-shadow:0 4px 24px rgba(201,169,110,.6)}
.bnav-center.active span{color:var(--gold)}

/* MAIN */
.main-area{margin-top:var(--header);margin-bottom:var(--bottomnav);min-height:calc(100vh - var(--header) - var(--bottomnav));padding:0 0 24px}

/* HOME HERO */
.home-hero{position:relative;height:200px;overflow:hidden;background:linear-gradient(135deg,#0a0a0a,#1a1a1a,#0d0d0d)}
.hero-overlay{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(201,169,110,.12) 0%,transparent 70%)}
.hero-content{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;padding:20px}
.hero-dior{font-family:var(--font-serif);font-size:48px;font-weight:400;letter-spacing:0.35em;color:#fff;text-transform:uppercase;margin-bottom:6px}
.hero-tagline{font-size:10px;color:rgba(201,169,110,.8);letter-spacing:0.25em;text-transform:uppercase;margin-bottom:16px}
.hero-user-info{display:flex;align-items:center;gap:8px;font-size:12px;color:rgba(255,255,255,.5)}

/* BALANCE */
.home-balance{padding:20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.balance-display{flex:1;min-width:140px}
.balance-display .bal-label{font-size:10px;color:var(--gray);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:4px}
.balance-display .bal-amount{font-size:26px;font-weight:600;color:var(--black)}
.balance-display .bal-amount span{color:var(--gold)}
.home-balance .btn{padding:10px 18px;font-size:11px;font-weight:500;letter-spacing:0.06em}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;padding:0 20px 20px}
.stat-card{background:var(--white);border:1px solid var(--light-gray);padding:16px;transition:border-color .2s}
.stat-card:hover{border-color:var(--gold)}
.stat-card .label{font-size:10px;color:var(--gray);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.1em;font-weight:400}
.stat-card .value{font-size:20px;font-weight:600}
.stat-card.gold .value{color:var(--gold)}
.stat-card.green .value{color:var(--grn)}

/* PROGRESS */
.progress-wrap{background:var(--white);border:1px solid var(--light-gray);padding:18px;margin:0 20px 20px}
.progress-wrap .prog-header{display:flex;justify-content:space-between;margin-bottom:8px}
.progress-wrap .prog-header .prog-label{font-family:var(--font-serif);font-size:14px;font-weight:400}
.progress-wrap .prog-header .prog-pct{font-size:13px;color:var(--gold);font-weight:500}
.prog-bar{height:6px;background:var(--light-gray);overflow:hidden}
.prog-bar .prog-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gld));transition:width .5s ease}
.prog-sub{font-size:11px;color:var(--gray);margin-top:8px}

/* VIP TIER */
.section-title{font-family:var(--font-serif);font-size:14px;font-weight:400;letter-spacing:0.02em;color:var(--black);padding:0 20px;margin-bottom:14px}
.vip-tier-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 20px 20px}
.vip-tier-card{background:var(--white);border:1px solid var(--light-gray);padding:18px;text-align:center;transition:all .3s;position:relative;overflow:hidden;cursor:pointer}
.vip-tier-card:hover{border-color:var(--gold);box-shadow:0 4px 16px rgba(0,0,0,.05)}
.vip-tier-card.reached{border-color:var(--gold);background:linear-gradient(135deg,rgba(201,169,110,.06),rgba(184,148,79,.02))}
.vip-tier-card .tier-icon{font-size:32px;margin-bottom:8px}
.vip-tier-card .tier-name{font-family:var(--font-serif);font-size:15px;font-weight:500;margin-bottom:4px}
.vip-tier-card .tier-deposit{font-size:11px;color:var(--gray);margin-bottom:4px}
.vip-tier-card .tier-commission{font-size:12px;color:var(--gold);font-weight:600}
.vip-tier-card.reached::after{content:'\2713';position:absolute;top:8px;right:10px;font-size:12px;color:var(--gold);font-weight:700}

/* PKG CARDS */
.pkg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;padding:0 20px 20px}
.pkg-card{background:var(--white);border:1px solid var(--light-gray);overflow:hidden;transition:all .3s;cursor:pointer;padding:18px}
.pkg-card:hover{border-color:var(--gold);box-shadow:0 8px 30px rgba(0,0,0,.06)}
.pkg-card.current{border-color:var(--gold);border-width:2px}
.pkg-card .pkg-name{font-family:var(--font-serif);font-size:14px;font-weight:500;margin-bottom:4px}
.pkg-card .pkg-meta{font-size:11px;color:var(--gray);margin-bottom:6px;line-height:1.6}
.pkg-card .pkg-stats{display:flex;gap:12px;font-size:11px;margin-bottom:8px}
.pkg-card .pkg-stats span{color:var(--gold);font-weight:600}

/* HOME PROMO */
.home-promo{display:flex;align-items:center;gap:14px;margin:0 20px 20px;padding:16px 20px;background:linear-gradient(135deg,var(--gold),var(--gld));color:#fff;cursor:pointer;transition:all .3s}
.home-promo:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(201,169,110,.4)}
.promo-icon{font-size:24px}
.promo-text{flex:1}
.promo-title{font-family:var(--font-serif);font-size:14px;font-weight:500;margin-bottom:2px}
.promo-desc{font-size:11px;opacity:.8}
.promo-arrow{font-size:24px;opacity:.7}

/* TABLE */
.tbl-wrap{background:var(--white);border:1px solid var(--light-gray);overflow-x:auto;margin:0 20px 20px}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:12px 14px;font-size:10px;color:var(--gray);text-transform:uppercase;letter-spacing:0.1em;border-bottom:1px solid var(--light-gray);background:var(--off-white);font-weight:500;white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--light-gray);font-size:12px}
tr:last-child td{border-bottom:none}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:500}
.badge.green{background:#e8f5e9;color:#2e7d32}
.badge.yellow{background:#fff8e1;color:#f57f17}
.badge.red{background:#ffebee;color:#c62828}
.badge.blue{background:#e3f2fd;color:#1565c0}
.badge.gray{background:#f0f0f0;color:#666}

/* ORDER TABS */
.order-tabs{display:flex;gap:0;padding:0 20px;margin-bottom:16px;border-bottom:1px solid var(--light-gray);overflow-x:auto}
.order-tab{padding:12px 16px;font-size:12px;color:var(--gray);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .2s;letter-spacing:0.02em}
.order-tab:hover{color:var(--black)}
.order-tab.active{color:var(--black);border-bottom-color:var(--gold);font-weight:500}

/* BUTTONS */
.btn{padding:10px 20px;font-size:11px;font-weight:500;transition:all .2s;display:inline-flex;align-items:center;gap:6px;letter-spacing:0.06em}
.btn-p{background:var(--black);color:var(--white)}
.btn-p:hover{opacity:.85}
.btn-s{background:var(--off-white);border:1px solid var(--light-gray)}
.btn-g{background:var(--grn);color:var(--white)}
.btn-r{background:var(--red);color:var(--white)}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gld));color:#fff;font-weight:600}
.btn-sm{padding:8px 14px;font-size:10px}

/* SPIN */
.spin-rotating{animation:spinRotate 1s linear infinite}
@keyframes spinRotate{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
.confetti-container{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;overflow:hidden}
.confetti{position:absolute;width:10px;height:10px;top:-10px;animation:confettiFall 3s linear forwards}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}

.spin-section{text-align:center;padding:24px 20px}
.spin-btn{width:200px;padding:14px;background:linear-gradient(135deg,var(--gold),var(--gld));color:#fff;border-radius:0;font-size:12px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;transition:all .25s;box-shadow:0 4px 24px rgba(201,169,110,.3)}
.spin-loading-text{display:flex;justify-content:center;gap:2px;font-family:var(--font-serif);font-size:18px;font-weight:500;color:var(--black);letter-spacing:.04em}
.spin-loading-text span{display:inline-block;animation:bounceChar .6s ease-in-out infinite alternate}
@keyframes bounceChar{0%{transform:translateY(0);color:var(--black)}100%{transform:translateY(-8px);color:var(--gold)}}
.spin-btn:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(201,169,110,.5)}
.spin-btn:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none;background:var(--gray)}
.spin-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 auto 20px;max-width:380px;padding:0 12px}
.spin-stat{background:var(--white);border:1px solid var(--light-gray);padding:14px 10px;text-align:center}
.spin-stat .spin-stat-label{font-size:10px;color:var(--gray);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px}
.spin-stat .spin-stat-value{font-size:18px;font-weight:600}
.spin-stat .spin-stat-value.gold{color:var(--gold)}

/* Spin steps indicator */
.spin-steps{display:flex;align-items:center;justify-content:center;gap:0;margin:0 auto 20px;max-width:340px}
.spin-step{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--gray);letter-spacing:.02em}
.spin-step.active{color:var(--gold);font-weight:600}
.spin-step.done{color:var(--grn)}
.spin-step-dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--light-gray);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;flex-shrink:0;transition:all .3s}
.spin-step.active .spin-step-dot{border-color:var(--gold);background:var(--gold);color:#fff}
.spin-step.done .spin-step-dot{border-color:var(--grn);background:var(--grn);color:#fff}
.spin-step-line{width:32px;height:2px;background:var(--light-gray);flex-shrink:0;margin:0 4px;transition:background .3s}
.spin-step-line.done{background:var(--grn)}

/* Spin wheel disabled state */
.spin-wheel-wrap.disabled{opacity:.45;pointer-events:none;filter:grayscale(.6)}
.spin-section .spin-disabled-hint{font-size:11px;color:var(--gray);margin-bottom:16px;padding:10px 16px;background:var(--off-white);display:inline-block;border:1px solid var(--light-gray)}

/* Processing overlay */
.processing-overlay{position:absolute;inset:0;background:rgba(0,0,0,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:8px;z-index:10}
.processing-spinner{width:36px;height:36px;border:3px solid rgba(255,255,255,.2);border-top-color:var(--gold);border-radius:50%;animation:spinRotate .8s linear infinite;margin-bottom:10px}
@keyframes spinRotate{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
.processing-text{color:#fff;font-size:12px;letter-spacing:.06em}

/* Product result inline */
.spin-result-inline{max-width:360px;margin:0 auto 20px;background:var(--white);border:2px solid var(--gold);padding:24px;text-align:center;animation:popIn .4s ease}
@keyframes popIn{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.spin-result-inline .sri-img{width:100px;height:100px;border-radius:50%;object-fit:cover;border:3px solid var(--gold);margin:0 auto 12px;display:block;box-shadow:0 4px 20px rgba(201,169,110,.3)}
.spin-result-inline .sri-name{font-family:var(--font-serif);font-size:17px;font-weight:500;margin-bottom:4px}
.spin-result-inline .sri-price{color:var(--gold);font-size:14px;font-weight:600;margin-bottom:10px}
.spin-result-inline .sri-info{font-size:11px;color:var(--gray);line-height:1.7;margin-bottom:16px}

/* SPIN PKG SELECT */
.spin-pkg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;padding:0 20px 20px}
.spin-pkg-card{background:var(--white);border:2px solid var(--light-gray);overflow:hidden;transition:all .3s;cursor:pointer;padding:20px;text-align:center}
.spin-pkg-card:hover{border-color:var(--gold);box-shadow:0 8px 30px rgba(0,0,0,.06)}
.spin-pkg-card.active{border-color:var(--gold);background:linear-gradient(135deg,rgba(201,169,110,.06),rgba(184,148,79,.02))}
.spin-pkg-card .sp-name{font-family:var(--font-serif);font-size:16px;font-weight:500;margin-bottom:8px}
.spin-pkg-card .sp-info{font-size:12px;color:var(--gray);margin-bottom:6px;line-height:1.7}
.spin-pkg-card .sp-commission{font-size:14px;color:var(--gold);font-weight:600;margin-bottom:12px}

/* SPIN RESULT */
.spin-result{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;display:none;align-items:center;justify-content:center;padding:20px}
.spin-result.show{display:flex}
.result-card{background:var(--white);padding:36px;text-align:center;max-width:360px;width:100%;animation:popIn .3s ease}
@keyframes popIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.result-card .result-name{font-family:var(--font-serif);font-size:18px;margin-bottom:4px}
.result-card .result-price{color:var(--gold);font-size:14px;font-weight:600;margin-bottom:12px}
.result-card .result-info{font-size:12px;color:var(--gray);margin-bottom:20px;line-height:1.7}
.result-card .result-prod-img{width:160px;height:160px;object-fit:cover;border:3px solid var(--gold);border-radius:8px;margin:0 auto 14px;display:block;box-shadow:0 4px 20px rgba(201,169,110,.25);background:var(--off-white)}
.result-card .result-btns{display:flex;flex-direction:column;gap:8px}
.result-card .btn{width:100%;justify-content:center;padding:14px}

/* PROFILE */
.profile-header{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,#1a1a1a,#2a2a2a);padding:24px 20px;color:#fff;position:relative;overflow:hidden}
.profile-header::before{content:'';position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(201,169,110,.08)}
.profile-avatar{width:64px;height:64px;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-family:var(--font-serif);font-size:22px;color:var(--gold);background:rgba(201,169,110,.1);flex-shrink:0;position:relative;z-index:1}
.profile-info{position:relative;z-index:1;flex:1;min-width:0}
.profile-info .name{font-family:var(--font-serif);font-size:18px;font-weight:400;letter-spacing:0.02em;margin-bottom:4px}
.profile-info .email{font-size:11px;color:rgba(255,255,255,.5);margin-bottom:8px}
.profile-info .profile-meta{display:flex;gap:14px;font-size:11px;flex-wrap:wrap}
.profile-info .profile-meta span{color:rgba(255,255,255,.6)}
.profile-info .profile-meta b{color:var(--gold)}
.profile-menu{background:var(--white);border-bottom:1px solid var(--light-gray)}
.profile-menu-item{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--light-gray);cursor:pointer;transition:background .15s;font-size:13px}
.profile-menu-item:last-child{border-bottom:none}
.profile-menu-item:hover{background:var(--off-white)}
.profile-menu-item svg{width:18px;height:18px;stroke:var(--gray);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.profile-menu-item .menu-label{flex:1}
.profile-menu-item .menu-arrow{color:var(--light-gray);font-size:16px}
.profile-section{background:var(--white);border:1px solid var(--light-gray);padding:24px 20px;margin:16px 20px}
.profile-section h3{font-family:var(--font-serif);font-size:16px;font-weight:400;margin-bottom:16px;letter-spacing:0.02em;padding-bottom:10px;border-bottom:1px solid var(--light-gray)}
.profile-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.profile-row .fg{margin-bottom:0}
.profile-row .fg.full{grid-column:1/-1}
.fg label{display:block;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--black);margin-bottom:8px;font-weight:400}
.fg input,.fg select{width:100%;padding:12px 0;border:none;border-bottom:1px solid var(--light-gray);font-family:var(--font-sans);font-size:14px;color:var(--black);background:transparent;transition:border-color .3s;outline:none;border-radius:0}
.fg input:focus,.fg select:focus{border-color:var(--black)}
.fg input:disabled{color:var(--gray);background:transparent}
.vip-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.vip-card{padding:16px;text-align:center;border:1px solid var(--light-gray);transition:all .3s;position:relative;overflow:hidden}
.vip-card.reached{border-color:var(--gold);background:linear-gradient(135deg,rgba(201,169,110,.06),rgba(184,148,79,.02))}
.vip-card .vip-tier-icon{font-size:28px;margin-bottom:6px}
.vip-card .vip-tier-name{font-family:var(--font-serif);font-size:14px;font-weight:500;margin-bottom:4px}
.vip-card .vip-tier-info{font-size:10px;color:var(--gray);line-height:1.7}

/* CHAT */
.chat-wrap{background:var(--white);margin:16px 20px;border:1px solid var(--light-gray);overflow:hidden;height:calc(100vh - var(--header) - var(--bottomnav) - 80px);display:flex;flex-direction:column}
.chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.chat-msg{max-width:80%;padding:10px 14px;font-size:13px;line-height:1.6}
.chat-msg.user{align-self:flex-end;background:var(--black);color:var(--white);border-bottom-right-radius:4px}
.chat-msg.admin{align-self:flex-start;background:var(--off-white);border-bottom-left-radius:4px}
.chat-msg .msg-time{font-size:9px;color:var(--gray);margin-top:4px}
.chat-input{display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--light-gray)}
.chat-input input{flex:1;border:none;border-bottom:1px solid var(--light-gray);padding:10px 0;font-size:13px;outline:none;background:transparent;border-radius:0}
.chat-input input:focus{border-color:var(--black)}
.chat-input .send-btn{width:36px;height:36px;border-radius:50%;background:var(--black);color:var(--white);display:flex;align-items:center;justify-content:center;font-size:14px;transition:opacity .2s}
.chat-input .send-btn:hover{opacity:.85}

/* MODAL */
.modal-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}

/* TOAST */
.toast{position:fixed;top:calc(var(--header) + 12px);left:50%;transform:translateX(-50%) translateY(-80px);background:var(--black);color:var(--white);padding:12px 24px;font-size:12px;letter-spacing:0.04em;z-index:999;transition:all .35s;opacity:0;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

.toast.err{background:#c41e3a}

/* CUSTOM CONFIRM DIALOG */

@keyframes fadeInBg{from{opacity:0}to{opacity:1}}
.confirm-dialog{background:var(--white);max-width:380px;width:100%;padding:0;animation:confirmPop .25s ease;overflow:hidden}

/* ===== SPIN WHEEL ANIMATION ===== */
.spin-wheel-wrap{position:relative;width:280px;height:280px;margin:0 auto 24px}
.spin-wheel{width:280px;height:280px;border-radius:50%;position:relative;overflow:hidden;transition:transform 4s cubic-bezier(.17,.67,.12,.99);box-shadow:0 0 0 6px var(--gold),0 0 0 10px rgba(201,169,110,.3),0 0 60px rgba(201,169,110,.25)}
.spin-wheel-bg{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,#1a1a1a 0deg,#2a2a2a 30deg,#1a1a1a 60deg,#2a2a2a 90deg,#1a1a1a 120deg,#2a2a2a 150deg,#1a1a1a 180deg,#2a2a2a 210deg,#1a1a1a 240deg,#2a2a2a 270deg,#1a1a1a 300deg,#2a2a2a 330deg,#1a1a1a 360deg)}
.spin-wheel-segments{position:absolute;inset:0;border-radius:50%;overflow:hidden}
.spin-seg{position:absolute;top:0;left:50%;width:2px;height:50%;transform-origin:bottom center;opacity:.3}
.spin-seg::after{content:'';position:absolute;top:0;left:-1px;width:4px;height:100%;background:var(--gold)}
.spin-wheel-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gld));display:flex;align-items:center;justify-content:center;z-index:5;box-shadow:0 2px 16px rgba(201,169,110,.5);font-family:var(--font-serif);font-size:16px;color:#fff;font-weight:500;letter-spacing:.1em}

.spin-glow{position:absolute;inset:-20px;border-radius:50%;background:radial-gradient(circle,rgba(201,169,110,.15) 0%,transparent 70%);pointer-events:none;animation:spinPulse 2s ease-in-out infinite}
@keyframes spinPulse{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}
.spin-active .spin-glow{animation:spinGlow .8s ease-in-out infinite}

<script>
const API_BASE = '/api';
let TOKEN = localStorage.getItem('dior_token') || '';
let USER = null;
let EXCHANGE_RATE = 27000;
let CURRENCY = localStorage.getItem('dior_currency') || 'USD'; // 'USD' or 'VND'

// Currency formatting helper
function fmtMoney(usd) {
  const v = parseFloat(usd || 0);
  if (CURRENCY === 'VND') {
    const vnd = Math.round(v * EXCHANGE_RATE);
    return vnd.toLocaleString('vi-VN') + 'đ';
  }
  return '$' + v.toFixed(2);
}
function maskBankAccount(acc) {
  if (!acc || acc.length < 4) return acc || '';
  const hide = Math.min(5, acc.length - 4);
  return '*'.repeat(hide) + acc.substring(hide);
}
function toggleBankAcc() {
  const input = document.getElementById('pfBankAccDisplay');
  const btn = document.getElementById('btnToggleAcc');
  if (!input || !btn) return;
  if (btn.textContent === 'Hiện') {
    input.value = USER?.bank_account || '';
    btn.textContent = 'Ẩn';
  } else {
    input.value = maskBankAccount(USER?.bank_account || '');
    btn.textContent = 'Hiện';
  }
}
function toggleCurrency() {
  CURRENCY = CURRENCY === 'USD' ? 'VND' : 'USD';
  localStorage.setItem('dior_currency', CURRENCY);
  // Re-render current page
  if (currentPage && typeof showPage === 'function') showPage(currentPage);
}
async function loadExchangeRate() {
  try {
    const r = await fetch('/api/settings/public');
    const d = await r.json();
    if (d?.data?.exchange_rate) EXCHANGE_RATE = parseFloat(d.data.exchange_rate);
  } catch(e) {}
}

// Global:阻止number input nhập chữ cái và số âm
document.addEventListener('input', function(e) {
  if (e.target.type === 'number') {
    e.target.value = e.target.value.replace(/[^0-9.]/g, '');
    if (parseFloat(e.target.value) < 0) e.target.value = '';
  }
});
let WS = null;

// ===== API HELPERS =====
async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN;
  try {
    const res = await fetch(API_BASE + path, { ...opts, headers: { ...headers, ...opts.headers } });
    const data = await res.json();
    if (res.status === 401) { doLogout(); return null; }
    if (!data.success) { if (data.need_topup) return data; toast(data.error || 'Lỗi', 'err'); return null; }
    return data;
  } catch(e) { toast('Lỗi kết nối', 'err'); return null; }
}
async function apiGet(p) { return api(p); }
async function apiPost(p, b) { return api(p, { method:'POST', body:JSON.stringify(b) }); }
async function apiPut(p, b) { return api(p, { method:'PUT', body:JSON.stringify(b) }); }

function toast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  setTimeout(()=>t.className='toast', 3000);
}
function openModal(html) { document.getElementById('modalContent').innerHTML = html; document.getElementById('modalBg').classList.add('show'); }
function closeModal() { document.getElementById('modalBg').classList.remove('show'); }
function showResult(html) { document.getElementById('resultCard').innerHTML = html; document.getElementById('spinResult').classList.add('show'); }
function hideResult() { document.getElementById('spinResult').classList.remove('show'); }

// ===== LOCK TOPUP =====


function showTopupDialog(topupAmt, availableBal, productName, productPrice) {
  var h = '<div class="confirm-dialog" style="max-width:380px">';
  h += '<div class="cd-icon">\u{1F504}</div>';
  h += '<div class="cd-title">C\u1ea7n n\u1eadp th\u00eam ti\u1ec1n</div>';
  h += '<div class="cd-desc">';
  h += 'S\u1ed1 d\u01b0 kh\u1ea3 d\u1ee5ng kh\u00f4ng \u0111\u1ee7 cho \u0111\u01a1n h\u00e0ng n\u00e0y.<br><br>';

function showConfirm(opts) {
  return new Promise(resolve => {
    const icon = opts.icon || '&#9998;';
    const title = opts.title || 'Xác nhận';
    const desc = opts.desc || '';
    const okLabel = opts.okLabel || 'Xác nhận';
    const okClass = opts.okClass || 'cd-ok';
    const html = '<div class="confirm-overlay" id="confirmOverlay"><div class="confirm-dialog"><div class="cd-header"><div class="cd-icon">' + icon + '</div><div class="cd-title">' + title + '</div><div class="cd-desc">' + desc + '</div></div><div class="cd-actions"><button class="cd-cancel" id="confirmCancel">Hủy</button><button class="' + okClass + '" id="confirmOk">' + okLabel + '</button></div></div></div>';
    const wrapper = document.createElement('div');
    wrapper.innerHTML = html;
    document.body.appendChild(wrapper);
    function cleanup(val) { document.getElementById('confirmOverlay')?.remove(); resolve(val); }
    document.getElementById('confirmCancel').onclick = () => cleanup(false);
    document.getElementById('confirmOk').onclick = () => cleanup(true);
    document.getElementById('confirmOverlay').onclick = (e) => { if (e.target.id === 'confirmOverlay') cleanup(false); };
  });
}

async function doLogin() {
  const login = document.getElementById('lgLogin').value.trim();
  const pass = document.getElementById('lgPass').value;
  if (!login) { document.getElementById('lgErr').textContent = 'Nhập username hoặc số điện thoại'; return; }
  if (!pass) { document.getElementById('lgErr').textContent = 'Nhập mật khẩu'; return; }
  document.getElementById('lgErr').textContent = '';
  try {
    const res = await fetch(API_BASE + '/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ login, password: pass })
    });
    const data = await res.json();
    if (data.success) {
      TOKEN = data.data.token;
      localStorage.setItem('dior_token', TOKEN);
      USER = data.data.user;
      initApp();
    } else {
      document.getElementById('lgErr').textContent = data.error || 'Sai tài khoản hoặc mật khẩu';
    }
  } catch(e) {
    document.getElementById('lgErr').textContent = 'Không kết nối được server';
  }
}

  TOKEN = ''; USER = null;

function initApp() {
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('appPage').style.display = 'block';
  document.querySelectorAll('.bnav-item,.bnav-center').forEach(n=>n.classList.remove('active'));
  document.querySelector('.bnav-item').classList.add('active');
  showPage('home', document.querySelector('.bnav-item'));
  connectWS();
  /* Balance refresh: use WebSocket push when available, fallback to polling every 60s */
  setInterval(async () => {
    const meData = await apiGet('/auth/me');
    if (meData) {
      USER = meData.data;
      USER.locked_amount = parseFloat(meData.data.locked_amount || 0);

      if (balEl && currentPage === 'home') balEl.textContent = fmtMoney(Math.max(0, parseFloat(USER.balance||0) - parseFloat(USER.locked_amount||0)));

}

/* ===== Withdraw VNĐ/USD currency toggle ===== */
let _wdCurrency = 'USD';
function setWithdrawCurrency(curr) {
  _wdCurrency = curr;
  document.getElementById('withdrawCurrency').value = curr;
  document.getElementById('wdCurrUSD').style.background = curr === 'USD' ? 'var(--gold)' : 'transparent';
  document.getElementById('wdCurrUSD').style.color = curr === 'USD' ? '#fff' : 'var(--gray)';
  document.getElementById('wdCurrVND').style.background = curr === 'VND' ? 'var(--gold)' : 'transparent';
  document.getElementById('wdCurrVND').style.color = curr === 'VND' ? '#fff' : 'var(--gray)';
  document.getElementById('wdCurrSymbol').textContent = curr === 'USD' ? '$' : '₫';
  document.getElementById('withdrawAmount').value = '';
  convertWithdrawAmount();
}
function convertWithdrawAmount() {
  const rate = EXCHANGE_RATE || 27000;
  const avail = Math.max(0, parseFloat(USER?.balance||0) - parseFloat(USER?.locked_amount||0));
  const val = parseFloat(document.getElementById('withdrawAmount')?.value) || 0;
  const hint = document.getElementById('wdConvertHint');
  if (_wdCurrency === 'USD') {
    const vnd = Math.round(val * rate);
    hint.textContent = val > 0 ? '= ₫' + vnd.toLocaleString('vi') : 'Tối đa: $' + avail.toFixed(2) + ' (₫' + Math.round(avail*rate).toLocaleString('vi') + ')';
  } else {
    const usd = val / rate;
    hint.textContent = val > 0 ? '= $' + usd.toFixed(2) : 'Tối đa: ₫' + Math.round(avail*rate).toLocaleString('vi') + ' ($' + avail.toFixed(2) + ')';
  }
}

async function submitWithdraw() {
  const method = document.querySelector('input[name="wdMethod"]:checked')?.value;
  const amt = parseFloat(document.getElementById('withdrawAmount')?.value);
  const curr = document.getElementById('withdrawCurrency')?.value || 'USD';
  const rate = EXCHANGE_RATE || 27000;
  const avail = Math.max(0, parseFloat(USER?.balance||0) - parseFloat(USER?.locked_amount||0));
  if (!method) { toast('Chọn phương thức rút tiền', 'err'); return; }
  if (!amt || amt <= 0) { toast('Nhập số tiền rút', 'err'); return; }

  // Validate against available balance in correct currency
  if (curr === 'VND') {
    const availVND = Math.round(avail * rate);
    if (amt > availVND) { toast('Số dư không đủ (khả dụng: ₫' + availVND.toLocaleString('vi') + ')', 'err'); return; }
  } else {
    if (amt > avail) { toast('Số dư không đủ (khả dụng: $' + avail.toFixed(2) + ')', 'err'); return; }
  }

  const body = { method };
  if (curr === 'VND') {
    body.amount_vnd = amt;
  } else {
    body.amount = amt;
  }
  if (method === 'bank') {
    body.bank_name = document.getElementById('wdBankName')?.value?.trim();
    body.account_number = document.getElementById('wdAccountNum')?.value?.trim();
    body.beneficiary_name = document.getElementById('wdBeneficiary')?.value?.trim();
    if (!body.bank_name || !body.account_number || !body.beneficiary_name) { toast('Vui lòng nhập đầy đủ thông tin ngân hàng', 'err'); return; }
  } else {
    body.momo_phone = document.getElementById('wdMomoPhone')?.value?.trim();
    if (!body.momo_phone) { toast('Vui lòng nhập số điện thoại MoMo', 'err'); return; }
  }

  body.withdraw_pin = document.getElementById('wdWithdrawPin')?.value || '';
  if (!body.withdraw_pin) { toast('Nhập mật khẩu bảo mật rút tiền', 'err'); return; }

  const d = await apiPost('/user/withdraw', body);
  if (d) {
    toast('Đã gửi yêu cầu rút ' + fmtMoney(amt) + '. Chờ admin phê duyệt.', 'ok');
    closeModal();
  }
}

function buildSpinWheel(disabled) {
  const segCount = 12;
  let segs = '';
  for (let i = 0; i < segCount; i++) {
    const angle = (i * 360) / segCount;
    segs += '<div class="spin-seg" style="transform:rotate(' + angle + 'deg)"></div>';
  }
  let imgs = '';
  for (const p of SPIN_PRODUCTS) {
    imgs += '<img class="spin-prod-img" src="' + p.img + '" alt="' + p.name + '" onerror="this.style.display=\'none\'">';
  }
  return '<div class="spin-wheel-wrap' + (disabled ? ' disabled' : '') + '">' +
    '<div class="spin-glow"></div>' +
    '<div class="spin-pointer"></div>' +
    '<div class="spin-wheel" id="spinWheel"><div class="spin-wheel-bg"></div><div class="spin-wheel-segments">' + segs + '</div><div class="spin-wheel-center">GO</div></div>' +
    '</div>' +
    '<div class="spin-products-carousel" id="spinCarousel">' + imgs + '</div>';
}

function startProductCarousel() {
  stopProductCarousel();
  let idx = 0;
  const imgs = document.querySelectorAll('#spinCarousel .spin-prod-img');
  if (!imgs.length) return;
  spinCarouselTimer = setInterval(() => {
    imgs.forEach(i => i.classList.remove('highlight'));
    imgs[idx % imgs.length].classList.add('highlight');
    idx++;
  }, 300);
}
function stopProductCarousel() {
  if (spinCarouselTimer) { clearInterval(spinCarouselTimer); spinCarouselTimer = null; }
  const imgs = document.querySelectorAll('#spinCarousel .spin-prod-img');
  imgs.forEach(i => i.classList.remove('highlight'));
}

function launchConfetti(count) {
  let container = document.getElementById('confettiWrap');
  if (!container) { container = document.createElement('div'); container.id = 'confettiWrap'; container.className = 'confetti-canvas'; document.body.appendChild(container); }
  container.innerHTML = '';
  const colors = ['#c9a96e','#b8944f','#e53935','#43a047','#1e88e5','#ff9800','#9c27b0','#ffd54f','#fff'];
  for (let i = 0; i < count; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    const x = Math.random() * window.innerWidth;
    const delay = Math.random() * 0.8;
    const dur = 2 + Math.random() * 2;
    const size = 6 + Math.random() * 10;
    const rot = Math.random() * 360;
    const color = colors[Math.floor(Math.random() * colors.length)];
    const shape = Math.random() > 0.5 ? '50%' : Math.random() > 0.5 ? '2px' : '0';
    piece.style.cssText = 'left:' + x + 'px;width:' + size + 'px;height:' + size + 'px;background:' + color + ';border-radius:' + shape + ';transform:rotate(' + rot + 'deg);animation:confettiDrop ' + dur + 's ease-in ' + delay + 's forwards;';
    container.appendChild(piece);
  }
  setTimeout(() => { if (container) container.innerHTML = ''; }, 5000);
}

function launchFireworks(x, y) {
  const colors = ['#c9a96e','#b8944f','#ffd54f','#ff9800','#e53935','#fff'];
  for (let burst = 0; burst < 3; burst++) {
    setTimeout(() => {
      const bx = x + (Math.random() - 0.5) * 200;
      const by = y + (Math.random() - 0.5) * 200;
      for (let i = 0; i < 20; i++) {
        const p = document.createElement('div');
        p.className = 'firework-particle';
        const angle = (i / 20) * 360;
        const dist = 40 + Math.random() * 80;
        const fx = Math.cos(angle * Math.PI / 180) * dist;
        const fy = Math.sin(angle * Math.PI / 180) * dist;
        p.style.cssText = 'position:fixed;left:' + bx + 'px;top:' + by + 'px;background:' + colors[Math.floor(Math.random() * colors.length)] + ';--fx:' + fx + 'px;--fy:' + fy + 'px;z-index:9999;pointer-events:none;';
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 1300);
      }
    }, burst * 300);
  }
}

  let h = '';
  for (let i = 0; i < steps.length; i++) {
    const cls = i < activeStep ? 'done' : i === activeStep ? 'active' : '';
    h += '<div class="spin-step ' + cls + '"><div class="spin-step-dot">' + (i < activeStep ? '\u2713' : (i+1)) + '</div><span>' + steps[i] + '</span></div>';
    if (i < steps.length - 1) h += '<div class="spin-step-line' + (i < activeStep ? ' done' : '') + '"></div>';
  }

  if (el) el.innerHTML = h;

  else if (lastStats?._hasPending) html += 'Có đơn chưa phân phối';
  else html += 'Nhận đơn hàng';
  html += '</button>';
  if (hasActive && lastStats?.package_completed) {
    html += '<div style="margin-top:12px"><button class="btn btn-gold" onclick="completePackage()">Nhận thưởng gian hàng</button></div>';
  }

  html += '<div style="margin-top:16px"><button class="btn btn-s btn-sm" onclick="renderSpin()">&larr; Chọn gian hàng khác</button></div>';

  /* Package selector */
  html += '<div class="spin-pkg-grid" style="margin-top:20px">';

      html += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">';

      html += '<div class="sp-info">' + p.max_orders + ' \u0111\u01a1n \u00b7 ' + p.daily_order_limit + '/ng\u00e0y</div>';
      html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px"><div class="sp-commission" style="margin:0">' + p.commission_rate + '%</div>';
      html += '<span style="font-size:10px;color:var(--gray)">$' + parseFloat(p.min_deposit).toLocaleString() + ' min</span></div>';
      if (isActive) html += '<div style="margin-top:10px;font-size:10px;color:var(--gold);font-weight:600;text-transform:uppercase;letter-spacing:.08em">&#9654; \u0110ang th\u1ef1c hi\u1ec7n</div>';
      html += '</div>';
    }
  } else {
    html += '<div style="grid-column:1/-1;text-align:center;padding:40px 20px;background:var(--white);border:1px solid var(--light-gray)"><div style="font-size:40px;margin-bottom:10px">&#128274;</div><div style="font-family:var(--font-serif);font-size:15px;margin-bottom:6px">Ch\u01b0a m\u1edf kh\u00f3a gian h\u00e0ng</div><div style="font-size:12px;color:var(--gray);margin-bottom:16px">N\u1eadp ti\u1ec1n \u0111\u1ec3 m\u1edf kh\u00f3a gian h\u00e0ng cao hơn</div><button class="btn btn-gold btn-sm" onclick="openDepositModal()">N\u1eadp ti\u1ec1n ngay</button></div>';
  }
  html += '</div></div>';

  document.getElementById('pageContent').innerHTML = html;
  if (hasActive) {
    updateSpinSteps(0);
    startProductCarousel();
  }
}

async function spinSelectPkg(id) {
  if (USER && USER.active_package_id === id) { renderSpin(); return; }
  const ok = await showConfirm({icon:'\u{1F6D2}',title:'Ch\u1ecdn gian h\u00e0ng',desc:'Bạn phải ho\u00e0n th\u00e0nh hết đơn trước khi chuyển gian khác. Tiếp tục?',okLabel:'Ch\u1ecdn'});
  if (!ok) return;
  const data = await apiPost('/user/select-package', { package_id: id });
  if (data) { toast(data.message || '\u0110\u00e3 ch\u1ecdn', 'ok'); USER.active_package_id = id; renderSpin(); }
}

async function doSpin() {
  if (isSpinning || spinState !== 'idle') return;
  const hasActive = USER && USER.active_package_id;
  if (!hasActive) { toast('Vui lòng chọn gian hàng trước', 'err'); return; }

  isSpinning = true;
  spinState = 'spinning';
  const btn = document.getElementById('spinBtn');
  const loadingArea = document.getElementById('spinLoadingArea');
  if (loadingArea) {
    const loadText = 'Đang tìm kiếm đơn hàng';
    loadingArea.innerHTML = '<div class="spin-loading-text">' + loadText.split('').map((ch, i) => '<span style="animation-delay:' + (i * 0.06) + 's">' + (ch === ' ' ? '&nbsp;' : ch) + '</span>').join('') + '</div>';
  }
  const section = document.querySelector('.spin-section');
  btn.disabled = true;
  btn.textContent = '\u0110ang t\u00ecm \u0111\u01a1n...';
  if (section) section.classList.add('spin-active');
  updateSpinSteps(0);
  document.getElementById('spinResultArea').innerHTML = '';

  startProductCarousel();

  try {
    const data = await Promise.race([
      apiPost('/orders/spin', { auto_topup: false }),
      new Promise(resolve => setTimeout(() => resolve(null), 10000))
    ]);
    if (data && data.need_topup) {
      stopProductCarousel();
      if (section) section.classList.remove('spin-active');
      if (loadingArea) loadingArea.innerHTML = '';
      spinState = 'idle';
      isSpinning = false;
      /* Cập nhật USER.balance ngay */
      if (data.locked_amount !== undefined && USER) USER.locked_amount = data.locked_amount;
      if (data.available_balance !== undefined) USER.balance = data.available_balance;
      /* Render lại spin page để hiện đơn pending phía trên vòng quay */
      renderSpin();
      showTopupDialog(data.topup_amount, data.available_balance, 'sản phẩm tiếp theo', data.price_required);
    } else if (data && data.data) {
      const r = data.data;
      if (r.balance !== undefined && USER) USER.balance = r.balance;
      if (r.locked_amount !== undefined && USER) USER.locked_amount = r.locked_amount;
      if (r.daily_spins_remaining !== undefined && lastStats) lastStats.daily_remaining = r.daily_spins_remaining;
      /* Background refresh home stats */
      refreshStats().then(s => { if (s && currentPage === 'home') { const w = document.getElementById('homeStatsWrap'); if (w) w.innerHTML = renderHomeStats(s); } });
      const product = r.product || {};
      /* Ưu tiên ảnh từ server; fallback sang ảnh local nếu server không có */
      const matchProd = SPIN_PRODUCTS.find(sp => sp.name === product.name);
      const prodImg = product.image || (matchProd ? matchProd.img : '');
      const prodName = product.name || 'Sản phẩm Dior';
      const prodPrice = parseFloat(product.price || (matchProd ? matchProd.price : 0));
      setTimeout(() => {
        stopProductCarousel();
        if (section) section.classList.remove('spin-active');
        /* Show result popup */
        if (loadingArea) loadingArea.innerHTML = '';
        spinState = 'result';
        lastSpinResult = r;
        lastSpinResult._prod = { name: prodName, price: prodPrice, img: prodImg };
        updateSpinSteps(1);
        showResult(
          '<div style="font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);margin-bottom:10px;font-weight:600">Chúc mừng! Bạn đã nhận được</div>' +
          (prodImg ? '<img class="result-prod-img" src="' + prodImg + '" alt="' + prodName + '" onerror="this.src=\'' + (matchProd ? matchProd.img : '') + '\';this.onerror=null">' : '') +
          '<div class="result-name">' + prodName + '</div>' +
          '<div class="result-price">' + fmtMoney(prodPrice) + '</div>' +
          '<div class="result-info">Mã đơn: <b>' + r.order_code + '</b><br>Tiến trình: ' + r.progress.completed + '/' + r.progress.total + ' (' + r.progress.percent + '%)</div>' +
          '<div class="result-btns">' +
          '<button class="btn btn-gold" onclick="doDistribute()">Phân phối ngay</button>' +
          '<button class="btn btn-s btn-sm" onclick="hideResult();renderSpin()">Đóng</button>' +
          '</div>'
        );
        isSpinning = false;
      /* Refresh spin page stats in background */
      refreshStats().then(s => { if (s) { lastStats = s; USER.balance = s.balance; USER.locked_amount = s.locked_amount; const w = document.getElementById('spinStatsWrap'); if (w) { let h = '<div class="spin-stats">'; h += '<div class="spin-stat"><div class="spin-stat-label">Hôm nay</div><div class="spin-stat-value gold">' + fmtMoney(s.today_commission||0) + '</div></div>'; h += '<div class="spin-stat"><div class="spin-stat-label">Đơn hàng</div><div class="spin-stat-value">' + (s.completed_in_package||0) + ' / ' + (s.total_in_package||0) + '</div></div>'; h += '<div class="spin-stat"><div class="spin-stat-label">Đóng băng</div><div class="spin-stat-value" style="color:var(--gold)">' + fmtMoney(s.locked_amount||0) + '</div></div>'; h += '</div>'; if (s.locked_amount > 0) { h += '<div style="max-width:380px;margin:0 auto 12px;padding:6px 12px;background:rgba(201,169,110,.06);border:1px solid rgba(201,169,110,.12);border-radius:6px;font-size:11px;display:flex;justify-content:space-between"><span style="color:var(--gray)">Số dư khả dụng</span><span style="font-weight:600">' + fmtMoney(Math.max(0, s.available_balance)) + '</span></div>'; } w.innerHTML = h; } } });
      }, 4200);
    } else {
      resetSpinUI();
    }
  } catch(e) {
    resetSpinUI();
  }
}

function resetSpinUI() {
  stopProductCarousel();
  const section = document.querySelector('.spin-section');
  if (section) section.classList.remove('spin-active');
  spinState = 'idle';
  isSpinning = false;
  const loadingArea = document.getElementById('spinLoadingArea');
  if (loadingArea) loadingArea.innerHTML = '';
  const btn = document.getElementById('spinBtn');
  if (btn) {
    btn.disabled = false;
    btn.textContent = 'Nh\u1eadn \u0111\u01a1n h\u00e0ng';
    btn.style.background = '';
    btn.onclick = doSpin;
  }
}

async function distributePendingOrder(orderId) {
  const btn = event.target;
  btn.disabled = true;
  btn.textContent = 'Đang phân phối...';
  const data = await apiPost('/orders/' + orderId + '/distribute');
  if (data && data.success) {
    const comm = parseFloat(data.data?.commission_added || data.data?.commission_amount || 0);
    toast('Phân phối thành công! +' + fmtMoney(comm) + ' hoa hồng', 'ok');
    // Cập nhật USER ngay lập tức
    if (data.data?.balance !== undefined) USER.balance = data.data.balance;
    if (data.data?.locked_amount !== undefined) USER.locked_amount = data.data.locked_amount;
    refreshStats().then(s => {
      if (s) {
        lastStats = s;
        USER.balance = s.balance;
        USER.locked_amount = s.locked_amount;
        if (currentPage === 'spin') {
          const w = document.getElementById('spinStatsWrap');
          if (w) renderSpinStats(w);
        }
      }
    });
    renderSpin();
  } else if (data && data.need_topup) {
    /* Đơn đóng băng nhưng chưa đủ tiền — hiện popup nạp tiền */
    showTopupDialog(data.topup_amount || 0, data.available_balance || 0, data.price_required ? ('đơn hàng ' + fmtMoney(data.price_required)) : 'đơn hàng', data.price_required || 0);
    btn.disabled = false;
    btn.textContent = 'Phân phối ngay';
  } else {
    btn.disabled = false;
    btn.textContent = 'Phân phối ngay';
  }
}

async function doDistribute() {
  if (spinState !== 'result' || !lastSpinResult) return;
  spinState = 'distributing';

  /* Show processing state in popup */
  document.getElementById('resultCard').innerHTML =
    '<div class="processing-spinner" style="margin:24px auto 16px"></div>' +
    '<div style="font-size:13px;color:var(--gray);letter-spacing:.04em;margin-bottom:8px">Đang phân phối đơn hàng...</div>' +
    '<div style="font-size:11px;color:var(--light-gray)">' + lastSpinResult._prod.name + '</div>';

  /* Commit financial/progress changes only after distribution succeeds */
  await new Promise(resolve => setTimeout(resolve, 1000));
  const distribution = await apiPost('/orders/' + lastSpinResult.order_id + '/distribute');
  if (!distribution) { spinState = 'result'; return; }
  /* Đơn đóng băng nhưng chưa đủ tiền */
  if (distribution.need_topup) {
    spinState = 'result';
    const needed = distribution.topup_amount || 0;
    const availBal = distribution.available_balance || 0;
    const priceReq = distribution.price_required || lastSpinResult._prod?.price || 0;
    document.getElementById('resultCard').innerHTML =
      '<div style="font-size:42px;margin-bottom:8px">&#128176;</div>' +
      '<div class="result-name" style="color:var(--red)">Số dư không đủ</div>' +
      '<div class="result-info">Đơn hàng yêu cầu: <b>' + fmtMoney(priceReq) + '</b><br>Số dư hiện tại: <b>' + fmtMoney(availBal) + '</b><br>Cần nạp thêm: <b style="color:var(--red)">' + fmtMoney(needed) + '</b></div>' +
      '<div class="result-btns">' +
      '<button class="btn btn-gold" onclick="hideResult();openDepositModal()">Nạp tiền ngay</button>' +
      '<button class="btn btn-s btn-sm" onclick="hideResult();renderSpin()">Đóng</button>' +
      '</div>';
    return;
  }
  lastSpinResult = Object.assign(lastSpinResult, distribution.data);

  /* Success! */
  spinState = 'idle';
  launchConfetti(80);
  launchFireworks(window.innerWidth / 2, window.innerHeight / 2);

  const r = lastSpinResult;
  const mp = lastSpinResult._prod;
  const distComm = parseFloat(r.commission_added || r.commission_amount || 0);

  updateSpinSteps(2);
  document.getElementById('resultCard').innerHTML =
    '<div style="font-size:42px;margin-bottom:8px">&#127881;</div>' +
    '<div class="result-name">Phân phối thành công!</div>' +
    (mp.img ? '<img class="result-prod-img" src="' + mp.img + '" alt="' + mp.name + '" style="width:120px;height:120px;margin-top:10px" onerror="this.style.display=\'none\'">' : '') +
    '<div class="result-price">' + fmtMoney(mp.price) + '</div>' +
    '<div class="result-info">Mã đơn: <b>' + r.order_code + '</b>' +
    (distComm > 0 ? '<br>Hoa hồng nhận: <b style="color:var(--grn)">' + fmtMoney(distComm) + '</b>' : '') +
    '<br>Tiến trình: ' + r.progress.completed + '/' + r.progress.total + ' (' + r.progress.percent + '%)</div>' +
    '<button class="btn btn-p" style="width:100%;justify-content:center;padding:14px" onclick="hideResult();renderSpin()">Tiếp tục quay</button>';

  isSpinning = false;
  lastSpinResult = null;
  /* Refresh stats after distribute */
  refreshStats().then(s => {
    if (s) {
      lastStats = s;
      if (currentPage === 'home') {
        const w = document.getElementById('homeStatsWrap');
        if (w) w.innerHTML = renderHomeStats(s);
      }
      if (currentPage === 'spin') {
        const w = document.getElementById('spinStatsWrap');
        if (w) renderSpinStats(w);
      }
    }
  });
}

// ===== CHAT / TRỢ GIÚP =====
let chatMessages = [];
function connectWS() {
  if (WS && WS.readyState === WebSocket.OPEN) return;
  const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  WS = new WebSocket(protocol + '//' + location.host + '/ws/chat');
  WS.onopen = () => { if (TOKEN) WS.send(JSON.stringify({ type: 'auth', token: TOKEN })); };
  WS.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.type === 'chat_sent') { appendChat(msg); }
      else if ((msg.type === 'chat' || msg.type === 'chat_msg') && msg.sender === 'admin') { appendChat(msg); }
    } catch(err) {}
  };
  WS.onclose = () => { setTimeout(connectWS, 3000); };
}
function appendChat(msg) {
  chatMessages.push(msg);
  const container = document.getElementById('chatMessages');
  if (!container) return;
  const div = document.createElement('div');
  div.className = 'chat-msg ' + (msg.sender === 'user' ? 'user' : 'admin');
  div.innerHTML = msg.message + '<div class="msg-time">' + new Date(msg.time).toLocaleTimeString('vi') + '</div>';
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}
async function renderChat() {
  const data = await apiGet('/user/chat?limit=50');
  chatMessages = data?.data || [];
  let html = '<div class="chat-wrap"><div class="chat-messages" id="chatMessages">';
  for (const m of chatMessages) {
    html += '<div class="chat-msg ' + (m.sender === 'user' ? 'user' : 'admin') + '">' + m.message + '<div class="msg-time">' + new Date(m.created_at).toLocaleTimeString('vi') + '</div></div>';
  }
  if (chatMessages.length === 0) html += '<div style="text-align:center;color:var(--gray);padding:48px;font-size:13px">Nhắn tin với admin để được hỗ trợ</div>';
  html += '</div><div class="chat-input"><input id="chatInput" placeholder="Nhập tin nhắn..." onkeypress="if(event.key===\'Enter\')sendChat()"><button class="send-btn" onclick="sendChat()">&#10148;</button></div></div>';
  document.getElementById('pageContent').innerHTML = html;
  const msgBox = document.getElementById('chatMessages');
  if (msgBox) msgBox.scrollTop = msgBox.scrollHeight;
}
function sendChat() {
  const input = document.getElementById('chatInput');
  if (!input) return;
  const msg = input.value.trim();
  if (!msg) return;
  if (WS && WS.readyState === WebSocket.OPEN) {
    WS.send(JSON.stringify({ type: 'chat', message: msg }));
    input.value = '';
  } else {
    toast('Mất kết nối chat', 'err');
  }
}

  html += '</div>';

  html += '<div id="profileDetail">';
  html += '<div class="profile-section"><h3>Thông tin cá nhân</h3>';
  html += '<div class="profile-row"><div class="fg"><label>Họ tên</label><input id="pfName" value="' + (USER?.full_name||'').replace(/"/g,'&quot;') + '"></div><div class="fg"><label>Email</label><input value="' + (USER?.email||'') + '" disabled style="opacity:.6"></div></div>';
  html += '<div class="profile-row"><div class="fg"><label>Số điện thoại</label><input value="' + (USER?.phone||'').replace(/"/g,'&quot;') + '" disabled style="opacity:.6"></div><div class="fg"><label>Username</label><input value="' + (USER?.username||'') + '" disabled style="opacity:.6"></div></div>';
  html += '<div style="font-size:11px;color:var(--gray);margin-bottom:10px">Chỉ có thể thay đổi họ tên. Đổi email, SĐT vui lòng liên hệ CSKH.</div>';
  html += '<button class="btn btn-p" onclick="saveProfile()" style="margin-top:4px">Lưu thay đổi</button></div>';

  var hasBank = USER?.bank_account || USER?.bank_name;
  html += '<div class="profile-section"><h3>Thông tin ngân hàng</h3>';
  if (hasBank) {
    var maskedAcc = maskBankAccount(USER?.bank_account||'');
    html += '<div style="font-size:11px;color:var(--gray);margin-bottom:12px">Đã lưu. Liên hệ CSKH để thay đổi.</div>';
    html += '<div class="profile-row"><div class="fg"><label>Số tài khoản</label><div style="display:flex;align-items:center;gap:8px"><input id="pfBankAccDisplay" value="' + maskedAcc + '" disabled style="opacity:.6;flex:1;font-family:monospace"><button class="btn btn-s btn-sm" type="button" id="btnToggleAcc" onclick="toggleBankAcc()">Hiện</button></div></div><div class="fg"><label>Ngân hàng</label><input value="' + (USER?.bank_name||'').replace(/"/g,'&quot;') + '" disabled style="opacity:.6"></div></div>';
    html += '<div class="profile-row"><div class="fg"><label>Tên chủ tài khoản</label><input value="' + (USER?.bank_holder||'').replace(/"/g,'&quot;') + '" disabled style="opacity:.6"></div></div>';
  } else {
    html += '<div style="font-size:11px;color:var(--gray);margin-bottom:12px">Nhập lần đầu. Sau khi lưu phải liên hệ CSKH để thay đổi.</div>';
    html += '<div class="profile-row"><div class="fg"><label>Số tài khoản</label><input id="pfBankAccount" placeholder="Nhập số tài khoản"></div><div class="fg"><label>Ngân hàng</label><input id="pfBankName" placeholder="VD: Vietcombank, Techcombank..."></div></div>';
    html += '<div class="profile-row"><div class="fg"><label>Tên chủ tài khoản</label><input id="pfBankHolder" placeholder="Tên trên tài khoản ngân hàng"></div><div class="fg"><label>Mật khẩu bảo mật rút tiền</label><input id="pfWithdrawPin" type="password" placeholder="Tối thiểu 4 ký tự"></div></div>';
    html += '<button class="btn btn-p" onclick="saveBankInfo()" style="margin-top:8px">Lưu thông tin ngân hàng</button>';
  }
  html += '</div>';

  var hasWH = USER?.warehouse_address;
  html += '<div class="profile-section"><h3>Địa chỉ kho</h3>';
  if (hasWH) {
    html += '<div style="font-size:11px;color:var(--gray);margin-bottom:12px">Đã lưu. Liên hệ CSKH để thay đổi.</div>';
    html += '<div style="padding:10px 14px;background:#faf8f5;border-radius:8px;font-size:13px;font-weight:500">' + (USER?.warehouse_address||'') + '</div>';
  } else {
    html += '<div style="font-size:11px;color:var(--gray);margin-bottom:12px">Nhập lần đầu. Sau khi lưu phải liên hệ CSKH để thay đổi.</div>';
    html += '<div class="fg"><label>Địa chỉ nhận hàng</label><input id="pfWarehouse" placeholder="VD: Việt Nam, Nhật Bản, Mỹ..."></div>';
    html += '<button class="btn btn-p" onclick="saveWarehouse()" style="margin-top:8px">Lưu địa chỉ</button>';
  }
  html += '</div>';

  html += '<div class="profile-section"><h3>Đổi mật khẩu</h3>';
  html += '<div style="font-size:12px;color:var(--gray);margin-bottom:4px">Để đổi mật khẩu, vui lòng liên hệ CSKH.</div></div>';

  html += '<div class="profile-section"><h3>Giao dịch gần đây</h3><div class="tbl-wrap"><table><thead><tr><th>Loại</th><th>Số tiền</th><th>Mô tả</th><th>Ngày</th></tr></thead><tbody>';
  if (txns.length) {
    for (const t of txns) {
      html += '<tr><td><span class="badge ' + (t.amount>=0?'green':'red') + '">' + (typeLabels[t.type]||t.type) + '</span></td><td><b style="color:' + (parseFloat(t.amount)>=0?'var(--grn)':'var(--red)') + '">' + (parseFloat(t.amount)>=0?'+':'') + fmtMoney(t.amount) + '</b></td><td>' + (t.description||'') + '</td><td>' + new Date(t.created_at).toLocaleDateString('vi') + '</td></tr>';
    }
  } else {
    html += '<tr><td colspan="4" style="text-align:center;color:var(--gray);padding:32px">Chưa có giao dịch</td></tr>';
  }
  html += '</tbody></table></div></div></div>';
  document.getElementById('pageContent').innerHTML = html;
}

function showProfileSection(section) {
  const detail = document.getElementById('profileDetail');
  if (!detail) return;
  if (section === 'info') { renderProfile(); return; }
  if (section === 'vip') {
    const vipNames = ['','Bạc','Vàng','Bạch Kim','Kim Cương'];
    const icons = ['','&#129351;','&#129352;','&#128142;','&#128167;'];
    let h = '<div class="profile-section"><h3>Hạng thành viên</h3><div class="vip-cards">';
    for (let t = 1; t <= 4; t++) {
      const minD = [0,500,1300,3000,5000]; const com = [0,0.6,1.2,2.0,2.5];
      const r = (USER?.vip_level||0) >= t;
      h += '<div class="vip-card ' + (r?'reached':'') + '"><div class="vip-tier-icon">' + icons[t] + '</div><div class="vip-tier-name">VIP ' + vipNames[t] + '</div><div class="vip-tier-info">Nạp $' + minD[t].toLocaleString() + '<br>Commission ' + com[t] + '%</div>' + (r ? '<div style="margin-top:8px;font-size:10px;font-weight:600;color:var(--gold)">Đạt được</div>' : '') + '</div>';
    }
    h += '</div></div>';
    detail.innerHTML = h;
  } else if (section === 'transactions') {
    renderProfileTransactions();
  } else if (section === 'depositHistory') {
    renderDepositWithdrawHistory();
  } else if (section === 'referral') {
    detail.innerHTML = '<div class="profile-section"><h3>Mời bạn bè</h3><div style="text-align:center;padding:20px"><div style="font-size:13px;color:var(--gray);margin-bottom:12px">Mã giới thiệu của bạn</div><div style="font-family:var(--font-serif);font-size:24px;letter-spacing:0.1em;color:var(--gold);margin-bottom:16px;font-weight:600">' + (USER?.ref_code||'N/A') + '</div><div style="font-size:12px;color:var(--gray);margin-bottom:16px">Chia sẻ mã này với bạn bè để nhận thưởng giới thiệu.</div><button class="btn btn-gold btn-sm" onclick="navigator.clipboard.writeText(\'' + (USER?.ref_code||'') + '\');toast(\'Đã copy mã giới thiệu\',\'ok\')">Copy mã giới thiệu</button></div></div>';
  } else if (section === 'address') {
    detail.innerHTML = '<div class="profile-section"><h3>Địa chỉ kho</h3><div class="fg"><label>Địa chỉ nhận hàng</label><input id="pfWarehouse2" value="' + (USER?.warehouse_address||'').replace(/"/g,'&quot;') + '" placeholder="VD: Việt Nam, Nhật Bản, Mỹ..."></div><button class="btn btn-p" onclick="saveWarehouseFromSection()" style="margin-top:8px">Lưu địa chỉ</button></div>';
  } else if (section === 'report') {
    detail.innerHTML = '<div class="profile-section"><h3>Báo cáo nhóm</h3><div style="text-align:center;padding:32px;color:var(--gray);font-size:13px">Tính năng đang được phát triển.</div></div>';
  } else if (section === 'about') {
    detail.innerHTML = `
      <div class="profile-section">
        <h3>Giới thiệu nền tảng</h3>
        <div style="font-size:13px;line-height:1.9;color:#444">
          <p style="text-align:center;font-family:var(--font-serif);font-size:15px;font-weight:600;color:var(--black);margin-bottom:6px">Người dùng thân mến, xin chào,</p>
          <p style="text-align:center;font-family:var(--font-serif);font-size:15px;font-weight:600;color:var(--gold);margin-bottom:20px">Chào mừng đến với nền tảng này!</p>

          <p style="margin-bottom:14px">Nền tảng này là nền tảng <b>đặt hàng đối sánh thông minh</b> của bên thứ ba trực thuộc <b>DIOR</b>. Nền tảng hợp tác với các công ty nền tảng mua sắm trực tuyến lớn như <b>Rakuten</b>, <b>Lazada</b>, <b>Amazon</b> để nghiên cứu công nghệ cốt lõi của blockchain và thúc đẩy đổi mới và phát triển sản phẩm.</p>

          <p style="margin-bottom:14px">Thông qua hệ thống đối sánh thông minh, các đơn đặt hàng của nhà cung cấp được khớp với người dùng nền tảng, để nhiều người mua sắm có thể mua sản phẩm của những người bán trên nền tảng chính để <b>tăng khối lượng bán hàng</b>, <b>tỷ lệ ưu đãi</b> và <b>trọng lượng cửa hàng</b> của mỗi người bán, do đó tăng doanh thu của thương gia.</p>

          <p style="margin-bottom:14px">Hệ thống này không chỉ là một kênh bán hàng mà là kênh để cho người tiêu dùng vừa có thể <b>quảng bá các sản phẩm</b> đến tay người tiêu dùng, vừa tạo được <b>dòng thu nhập theo từng giá trị sản phẩm</b> cho khách hàng.</p>

          <p>Nhằm thúc đẩy được lượt mua bán lọt top các thương hiệu lớn trên Thị trường quốc tế.</p>
        </div>
      </div>`;
  }
}

async function renderProfileTransactions() {
  const txData = await apiGet('/user/transactions?limit=10');
  const txns = txData?.data?.transactions || [];
  const typeLabels = { deposit:'Nạp tiền', withdraw:'Rút tiền', order_deduct:'Trừ đơn', order_refund:'Hoàn tiền', commission:'Hoa hồng', admin_adjust:'Admin', referral_bonus:'Giới thiệu', unlock:'Giải phóng khóa', lock_topup:'Khóa tiền', order_lock:'Khóa đơn' };
  const detail = document.getElementById('profileDetail');
  if (!detail) return;
  let h = '<div class="profile-section"><h3>Lịch sử giao dịch</h3><div class="tbl-wrap"><table><thead><tr><th>Loại</th><th>Số tiền</th><th>Mô tả</th><th>Ngày</th></tr></thead><tbody>';
  if (txns.length) {
    for (const t of txns) {
      h += '<tr><td><span class="badge ' + (t.amount>=0?'green':'red') + '">' + (typeLabels[t.type]||t.type) + '</span></td><td><b style="color:' + (parseFloat(t.amount)>=0?'var(--grn)':'var(--red)') + '">' + (parseFloat(t.amount)>=0?'+':'') + fmtMoney(t.amount) + '</b></td><td>' + (t.description||'') + '</td><td>' + new Date(t.created_at).toLocaleDateString('vi') + '</td></tr>';
    }
  } else {
    h += '<tr><td colspan="4" style="text-align:center;color:var(--gray);padding:32px">Chưa có giao dịch</td></tr>';
  }
  h += '</tbody></table></div></div>';
  detail.innerHTML = h;
}

async function renderDepositWithdrawHistory() {
  // Fetch fresh user data + withdrawals + transactions in parallel
  const [meData, wdData, txData] = await Promise.all([
    apiGet('/auth/me'),
    apiGet('/user/withdrawals?limit=50'),
    apiGet('/user/transactions?limit=50')
  ]);
  if (meData) {
    USER = meData.data;
    USER.locked_amount = parseFloat(meData.data.locked_amount || 0);
    USER.balance = parseFloat(meData.data.balance || 0);
  }
  const detail = document.getElementById('profileDetail');
  if (!detail) return;
  const withdrawals = wdData?.data?.withdrawals || [];
  const txns = txData?.data?.transactions || [];
  const deposits = txns.filter(t => t.type === 'deposit');

  const statusLabels = { pending:'Chờ xử lý', approved:'Đã duyệt', rejected:'Bị từ chối', cancelled:'Đã hủy' };
  const statusColors = { pending:'var(--gold)', approved:'var(--grn)', rejected:'var(--red)', cancelled:'var(--gray)' };

  let h = '<div class="profile-section"><h3>Lịch sử nạp/rút tiền</h3>';

  // Tab buttons
  h += '<div style="display:flex;gap:8px;margin-bottom:16px"><button class="btn btn-gold btn-sm" id="wdTabBtn" onclick="showWdTab(\'withdrawals\')">Rút tiền (' + withdrawals.length + ')</button><button class="btn btn-s btn-sm" id="depTabBtn" onclick="showWdTab(\'deposits\')">Nạp tiền (' + deposits.length + ')</button></div>';

  // Withdrawals tab
  h += '<div id="wdTabWithdrawals"><div class="tbl-wrap"><table><thead><tr><th>Phương thức</th><th>Chi tiết</th><th>Số tiền</th><th>Trạng thái</th><th>Ngày</th><th></th></tr></thead><tbody>';
  if (withdrawals.length) {
    for (const w of withdrawals) {
      const detail = w.method === 'bank' ? (w.bank_name + ' · ' + maskBankAccount(w.account_number) + ' · ' + w.beneficiary_name) : ('MoMo · ' + w.momo_phone);
      h += '<tr><td style="text-transform:capitalize">' + (w.method === 'bank' ? 'Ngân hàng' : 'MoMo') + '</td><td style="font-size:11px">' + detail + '</td><td style="font-weight:600;color:var(--red)">-' + fmtMoney(w.amount) + '</td><td><span style="color:' + statusColors[w.status] + ';font-weight:600;font-size:12px">' + statusLabels[w.status] + '</span>' + (w.admin_note ? '<div style="font-size:10px;color:var(--gray);margin-top:2px">Lý do: ' + w.admin_note + '</div>' : '') + '</td><td style="font-size:11px">' + new Date(w.created_at).toLocaleDateString('vi') + '</td><td>' + (w.status === 'pending' ? '<button class="btn btn-s btn-sm" style="font-size:10px;padding:2px 8px" onclick="cancelWithdraw(' + w.id + ')">Hủy</button>' : '') + '</td></tr>';
    }
  } else {
    h += '<tr><td colspan="6" style="text-align:center;color:var(--gray);padding:24px">Chưa có lệnh rút tiền</td></tr>';
  }
  h += '</tbody></table></div></div>';

  // Deposits tab (hidden by default)
  h += '<div id="wdTabDeposits" style="display:none"><div class="tbl-wrap"><table><thead><tr><th>Số tiền</th><th>Mô tả</th><th>Ngày</th></tr></thead><tbody>';
  if (deposits.length) {
    for (const d of deposits) {
      h += '<tr><td style="font-weight:600;color:var(--grn)">+' + fmtMoney(d.amount) + '</td><td>' + (d.description||'') + '</td><td>' + new Date(d.created_at).toLocaleDateString('vi') + '</td></tr>';
    }
  } else {
    h += '<tr><td colspan="3" style="text-align:center;color:var(--gray);padding:24px">Chưa có lịch sử nạp tiền</td></tr>';
  }
  h += '</tbody></table></div></div></div>';

  // Button to create new withdrawal
  const avail = Math.max(0, parseFloat(USER?.balance||0) - parseFloat(USER?.locked_amount||0));
  h += '<div style="margin-top:16px"><button class="btn btn-gold" onclick="openWithdrawModal()">+ Tạo lệnh rút tiền mới</button><span style="font-size:12px;color:var(--gray);margin-left:12px">Khả dụng: ' + fmtMoney(avail) + '</span></div>';

  detail.innerHTML = h;
}

function showWdTab(tab) {
  const wdDiv = document.getElementById('wdTabWithdrawals');
  const depDiv = document.getElementById('wdTabDeposits');
  const wdBtn = document.getElementById('wdTabBtn');
  const depBtn = document.getElementById('depTabBtn');
  if (tab === 'withdrawals') {
    wdDiv.style.display = ''; depDiv.style.display = 'none';
    wdBtn.className = 'btn btn-gold btn-sm'; depBtn.className = 'btn btn-s btn-sm';
  } else {
    wdDiv.style.display = 'none'; depDiv.style.display = '';
    wdBtn.className = 'btn btn-s btn-sm'; depBtn.className = 'btn btn-gold btn-sm';
  }
}

async function cancelWithdraw(id) {
  const ok = await showConfirm({icon:'&#10060;',title:'Hủy lệnh rút',desc:'Bạn muốn hủy lệnh rút này?',okLabel:'Hủy lệnh',okClass:'cd-ok red'});
  if (!ok) return;
  const d = await apiPost('/user/withdrawals/' + id + '/cancel');
  if (d) { toast('Đã hủy lệnh rút', 'ok'); renderDepositWithdrawHistory(); }
}

async function saveProfile() {
  const data = await apiPut('/user/profile', {
    full_name: document.getElementById('pfName').value
  });
  if (data) { toast('Đã cập nhật', 'ok'); const me = await apiGet('/auth/me'); if (me) USER = me.data; }
}

async function saveBankInfo() {
  const body = {
    bank_name: document.getElementById('pfBankName').value.trim(),
    bank_account: document.getElementById('pfBankAccount').value.trim(),
    bank_holder: document.getElementById('pfBankHolder').value.trim()
  };
  const pin = document.getElementById('pfWithdrawPin').value;
  if (pin) {
    if (pin.length < 4) { toast('Mật khẩu bảo mật tối thiểu 4 ký tự', 'err'); return; }
    body.withdraw_pin = pin;
  }
  if (!body.bank_name || !body.bank_account || !body.bank_holder) { toast('Vui lòng nhập đầy đủ thông tin ngân hàng', 'err'); return; }
  const data = await apiPut('/user/profile', body);
  if (data) { toast('Đã lưu thông tin ngân hàng', 'ok'); const me = await apiGet('/auth/me'); if (me) USER = me.data; renderProfile(); }
}

async function saveWarehouse() {
  const addr = document.getElementById('pfWarehouse').value.trim();
  if (!addr) { toast('Nhập địa chỉ kho', 'err'); return; }
  const data = await apiPut('/user/profile', { warehouse_address: addr });
  if (data) { toast('Đã lưu địa chỉ kho', 'ok'); const me = await apiGet('/auth/me'); if (me) USER = me.data; renderProfile(); }
}

async function saveWarehouseFromSection() {
  const addr = document.getElementById('pfWarehouse2').value.trim();
  if (!addr) { toast('Nhập địa chỉ kho', 'err'); return; }
  const data = await apiPut('/user/profile', { warehouse_address: addr });
  if (data) { toast('Đã lưu địa chỉ kho', 'ok'); const me = await apiGet('/auth/me'); if (me) USER = me.data; }
}

async function changePassword() {
  const cur = document.getElementById('pfCurPass').value;
  const np = document.getElementById('pfNewPass').value;
  const cf = document.getElementById('pfConfirmPass').value;
  if (!cur) { toast('Nhập mật khẩu hiện tại', 'err'); return; }
  if (!np || np.length < 6) { toast('Mật khẩu mới tối thiểu 6 ký tự', 'err'); return; }
  if (np !== cf) { toast('Mật khẩu xác nhận không khớp', 'err'); return; }
  const data = await apiPut('/user/password', { current_password: cur, new_password: np });
  if (data) {
    toast('Đã đổi mật khẩu', 'ok');
    document.getElementById('pfCurPass').value = '';
    document.getElementById('pfNewPass').value = '';
    document.getElementById('pfConfirmPass').value = '';
  }
}
</script>
</body>
</html>
